# Training Configuration: Calibrated TF-IDF + Logistic Regression
model:
  name: "aegis-linear-v1"
  type: "calibrated_linear"
  vectorizer:
    ngram_range: [1, 3]
    analyzer: "word"
    lowercase: true
    max_features: 12000
    sublinear_tf: true
  classifier:
    C: 2.0
    max_iter: 1000
    class_weight: "balanced"
    solver: "lbfgs"
  calibration:
    method: "sigmoid"
    cv: 5

data:
  train_path: "data/processed/train.jsonl"
  val_path: "data/processed/val.jsonl"
  test_path: "data/processed/test.jsonl"
  seed: 42

export:
  onnx_path: "models/classifier.onnx"
  joblib_path: "models/classifier.joblib"
  target_opset: 15
