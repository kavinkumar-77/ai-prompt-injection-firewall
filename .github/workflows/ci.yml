name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-quality:
    name: Backend Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pip-audit
          pip install -r backend/requirements.txt
          pip install -e aegis_client

      - name: Ruff Linter
        run: |
          ruff check .

      - name: Ruff Formatter Check
        run: |
          ruff format --check .

      - name: Mypy Type Check
        run: |
          mypy backend aegis_client

      - name: Pytest with Coverage
        run: |
          pytest backend/tests --cov=backend/app --cov-report=term-missing

      - name: Security Dependency Audit (pip-audit)
        run: |
          pip-audit --desc || true

  frontend-and-extension:
    name: Frontend & Extension Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            dashboard/package-lock.json
            extension/package-lock.json

      - name: Build Dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Test Chrome Extension
        run: |
          cd extension
          npm ci
          npm test
