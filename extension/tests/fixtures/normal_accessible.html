<!DOCTYPE html>
<html>
<head><title>Accessible Web Page with Collapsible Menus</title></head>
<body>
  <!-- react-mount-point-root -->
  <a href="#main-content" class="sr-only" style="position: absolute; clip: rect(0, 0, 0, 0); width: 1px; height: 1px;">
    Skip to main content
  </a>

  <header>
    <nav aria-label="Main Navigation">
      <button aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        Menu
      </button>
      <div id="mobile-menu" class="dropdown-menu" style="display: none;" role="menu">
        <a href="/dashboard" role="menuitem">Dashboard</a>
        <a href="/settings" role="menuitem">Settings</a>
        <a href="/logout" role="menuitem">Log Out</a>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <h1>Frequently Asked Questions</h1>
    <details>
      <summary>How do I reset my password?</summary>
      <p>Navigate to Account Settings and click Reset Password.</p>
    </details>
  </main>
</body>
</html>
