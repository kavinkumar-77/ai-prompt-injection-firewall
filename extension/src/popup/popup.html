<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project AEGIS Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-box">
        <div class="logo-dot"></div>
        <span class="logo-title">PROJECT AEGIS</span>
      </div>
      <span class="badge-active">ACTIVE</span>
    </header>

    <div class="status-card">
      <div class="shield-icon">🛡️</div>
      <div class="status-info">
        <div class="status-title" id="status-title">System Protected</div>
        <div class="status-sub" id="status-sub">DOM Scanner & Taint Guard Online</div>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-box">
        <div class="metric-num" id="blocked-count">0</div>
        <div class="metric-label">Threats Blocked</div>
      </div>
      <div class="metric-box">
        <div class="metric-num" id="taint-count">0</div>
        <div class="metric-label">Tainted Fields</div>
      </div>
    </div>

    <div class="action-section">
      <button id="scan-btn" class="primary-button">
        Scan Current Tab
      </button>
      <button id="dashboard-btn" class="secondary-button">
        Open Threat Dashboard
      </button>
    </div>

    <div id="scan-feedback" class="feedback-text">
      Ready to analyze active DOM tree.
    </div>

    <footer class="footer">
      AI Prompt-Injection & Data-Leak Firewall
    </footer>
  </div>
  <script type="module" src="../../dist/popup/popup.js"></script>
</body>
</html>
